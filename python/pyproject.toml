[project]
name = "veiculosbr"
version = "0.1.0"
description = "Placa (antiga e Mercosul), RENAVAM, chassi e preço FIPE, inclusive pela placa"
readme = "README.md"
license = "MIT"
authors = [{ name = "Marlon Hesly", email = "marlonhesly@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "platformdirs>=4.0",
    "selectolax>=1.0",
]
keywords = ["fipe", "placa", "mercosul", "renavam", "chassi", "brasil"]
classifiers = [
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/biuspoly/veiculosbr"

[project.scripts]
veiculosbr = "veiculosbr.__main__:principal"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veiculosbr"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
