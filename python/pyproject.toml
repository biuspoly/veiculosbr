[project]
name = "veiculosbr"
version = "0.1.1"
description = "Placa (antiga e Mercosul), RENAVAM e preço FIPE, inclusive pela placa"
readme = "README.md"
# O código é MIT; a tabela de faixas por estado (dados/faixas_uf.csv) vem da Wikipédia, CC BY-SA.
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE", "src/veiculosbr/dados/LEIAME.md"]
authors = [{ name = "Marlon Amaral", email = "marlonsouzapro@outlook.com" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
]
keywords = ["fipe", "placa", "mercosul", "renavam", "brasil"]
classifiers = [
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/biuspoly/veiculosbr"
Issues = "https://github.com/biuspoly/veiculosbr/issues"

[project.scripts]
veiculosbr = "veiculosbr.__main__:principal"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veiculosbr"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
